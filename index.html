<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Petit Bac</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#e8590c;--bd:#e5e0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--card:#22252c;--tx:#f1f1f1;--mut:#9aa0ab;--ac:#ff8a4c;--bd:#343843;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181d;--card:#22252c;--tx:#f1f1f1;--mut:#9aa0ab;--ac:#ff8a4c;--bd:#343843;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:15px;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;width:100%;padding:14px;font-size:18px;margin-top:16px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:6px 12px}
.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:150px;font-weight:800;text-align:center;color:var(--ac);line-height:1.1}
.time{font-size:44px;text-align:center;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
td button{width:48px;padding:8px 0}.rk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script></head><body><main id="app"></main>
<script>
const L="ABCDEFGHIJLMNOPRSTUV";
const S={scr:"setup",pl:["Joueur 1","Joueur 2","Joueur 3"],cats:["Prénom","Pays","Ville","Animal","Fruit / légume","Métier","Objet","Célébrité"],dur:90,used:[],letter:"",left:0,tot:{},sc:{},rnd:0};
let T=null;const $=s=>document.getElementById(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let RM=null;function R(){if(S.scr[0]=="o")return RO();const a=$("app");
if(S.scr=="setup"){a.innerHTML=`<h1>🎲 Petit Bac</h1><h2>Joueurs</h2><div class="card">${S.pl.map((p,i)=>`<div class="row"><input data-i="${i}" value="${esc(p)}"><button data-a="rp" data-i="${i}">✕</button></div>`).join("")}<button data-a="ap">+ Ajouter un joueur</button></div>
<h2>Catégories</h2><div class="card"><div class="chips">${S.cats.map((c,i)=>`<span class="chip">${esc(c)} <b data-a="rc" data-i="${i}" style="cursor:pointer">✕</b></span>`).join("")}</div><div class="row" style="margin-top:10px"><input id="nc" placeholder="Nouvelle catégorie"><button data-a="ac">+</button></div></div>
<h2>Durée</h2><div class="row">${[60,90,120,180].map(d=>`<button class="${S.dur==d?"on":""}" data-a="d" data-i="${d}" style="flex:1">${d} s</button>`).join("")}</div>
<button class="p" data-a="go">Commencer (un seul téléphone)</button><button data-o="menu" style="width:100%;margin-top:10px">🌐 Jouer en ligne, chacun son téléphone</button>`}
else if(S.scr=="ready"){a.innerHTML=`<h1>Manche ${S.rnd+1}</h1><div class="card"><div class="chips">${S.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div></div><button class="p" data-a="draw">Tirer la lettre et lancer</button>`}
else if(S.scr=="play"){a.innerHTML=`<h1>Manche ${S.rnd+1}</h1><div class="big">${S.letter}</div><div class="time" id="tm">${S.left}</div><div class="card" style="margin-top:12px"><div class="chips">${S.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div></div><button class="p" data-a="stop">STOP ! J’ai fini</button>`}
else if(S.scr=="score"){const tt=S.pl.map((p,j)=>S.cats.reduce((s,c,i)=>s+S.sc[j][i],0));
a.innerHTML=`<h1>Points · lettre ${S.letter}</h1><p style="color:var(--mut);margin:0 0 10px">Touchez pour changer : 10 = réponse unique, 5 = doublon, 0 = faux ou vide.</p><div class="card sc"><table><tr><th></th>${S.pl.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>${S.cats.map((c,i)=>`<tr><td>${esc(c)}</td>${S.pl.map((p,j)=>`<td><button data-a="s" data-j="${j}" data-i="${i}">${S.sc[j][i]}</button></td>`).join("")}</tr>`).join("")}<tr><td><b>Total</b></td>${tt.map(t=>`<td><b>${t}</b></td>`).join("")}</tr></table></div><button class="p" data-a="val">Valider la manche</button>`}
else{const r=S.pl.map((p,j)=>[p,S.tot[j]]).sort((x,y)=>y[1]-x[1]);
a.innerHTML=`<h1>🏆 Classement</h1><div class="card">${r.map((x,i)=>`<div class="rk"><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${esc(x[0])}</span><b>${x[1]} pts</b></div>`).join("")}</div><button class="p" data-a="next">Manche suivante</button><button data-a="new" style="width:100%;margin-top:10px">Nouvelle partie</button>`}}
function tick(){S.left--;const t=$("tm");if(t)t.textContent=S.left;if(S.left<=0)stop()}
function stop(){clearInterval(T);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}
S.sc=S.pl.map(()=>S.cats.map(()=>0));S.scr="score";R()}
document.addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined&&e.target.tagName=="INPUT")S.pl[i]=e.target.value||"Joueur "+(+i+1)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
if(a=="rp"){if(S.pl.length>2)S.pl.splice(i,1)}
else if(a=="ap"){if(S.pl.length<10)S.pl.push("Joueur "+(S.pl.length+1))}
else if(a=="rc"){if(S.cats.length>2)S.cats.splice(i,1)}
else if(a=="ac"){const v=$("nc").value.trim();if(v)S.cats.push(v)}
else if(a=="d")S.dur=i;
else if(a=="go"){S.tot={};S.pl.forEach((p,k)=>S.tot[k]=0);S.rnd=0;S.used=[];S.scr="ready"}
else if(a=="draw"){let p=[...L].filter(c=>!S.used.includes(c));if(!p.length){S.used=[];p=[...L]}S.letter=p[Math.floor(Math.random()*p.length)];S.used.push(S.letter);S.left=S.dur;S.scr="play";clearInterval(T);T=setInterval(tick,1000)}
else if(a=="stop")stop();
else if(a=="s"){const v=S.sc[j][i];S.sc[j][i]=v==0?10:v==10?5:0}
else if(a=="val"){S.pl.forEach((p,k)=>S.tot[k]+=S.cats.reduce((s,c,m)=>s+S.sc[k][m],0));S.scr="rank"}
else if(a=="next"){S.rnd++;S.scr="ready"}
else if(a=="new")S.scr="setup";
R()});
R();
</script><script>
const ini=r=>{RM=r;if(!r)return;const h=(location.hash||"").slice(1).toLowerCase();if(/^[a-z0-9]{3,4}$/.test(h)){O.pre=h;S.scr="o_menu";RO()}else if(S.scr=="setup")R()};
setTimeout(()=>{if(window.claude)claude.use("room").then(ini).catch(()=>{});else if(window.Peer)ini({})},0);
let NR=null,O={name:"",ans:{},seen:{}};const QL=window.claude?"https://claude.ai/artifact/AgRUe8TjREeGQyq9832GhW":location.href.split("#")[0];
const nz=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const bc=()=>NR&&NR.emit("state",O.st);
function SC(r){const A=O.ans[r]||{},pl=O.st.pl,l=nz(O.st.letter),res={};pl.forEach(p=>res[p]=O.st.cats.map(()=>0));
O.st.cats.forEach((c,i)=>{const v=pl.map(p=>nz((A[p]||[])[i]||""));pl.forEach((p,j)=>{const x=v[j];if(x&&x[0]==l)res[p][i]=v.filter(y=>y==x).length>1?5:10})});return res}
function PJ(code,host){return new Promise((ok,ko)=>{const hs={},cs=[];let up=null,peer;
const dl=m=>(hs[m.t]||[]).forEach(f=>f({data:m.d}));
const api={on:(t,f)=>{(hs[t]=hs[t]||[]).push(f)},emit:(t,d)=>{const m={t,d};dl(m);if(host)cs.forEach(c=>c.open&&c.send(m));else if(up&&up.open)up.send(m)},leave:async()=>{try{peer.destroy()}catch(e){}}};
let done=false;const fin=()=>{done=true;clearTimeout(tm);ok(api)};const tm=setTimeout(()=>{if(!done){try{peer.destroy()}catch(e){}ko(new Error("timeout"))}},15000);
if(host){peer=new Peer("pbac-"+code);peer.on("open",fin);
peer.on("connection",c=>{cs.push(c);c.on("data",m=>{dl(m);cs.forEach(o=>o!==c&&o.open&&o.send(m))});c.on("close",()=>{const i=cs.indexOf(c);if(i>=0)cs.splice(i,1)})})}
else{peer=new Peer();peer.on("open",()=>{up=peer.connect("pbac-"+code,{reliable:true,serialization:"json"});up.on("open",fin);up.on("data",dl)})}
peer.on("error",e=>{if(done)return;clearTimeout(tm);try{peer.destroy()}catch(x){}ko(e)})})}
async function conn(code,host){try{NR=await(RM.join?RM.join("pbac-"+code):PJ(code,host))}catch(e){O.busy=false;const t=e&&(e.type||e.message)||"?";O.err=t=="peer-unavailable"?"Code introuvable. Vérifie le code, et que l’hôte a gardé son écran allumé.":t=="unavailable-id"?"Ce code est déjà utilisé, réessaie.":"Connexion impossible ("+t+"). Essayez avec le même Wi-Fi.";return RO()}
O.busy=false;O.last="";O.code=code;O.host=host;O.ans={};O.sent=-1;O.mineR=-1;
O.st=host?{ph:"lobby",r:0,pl:[O.name],cats:S.cats,dur:S.dur,tot:{[O.name]:0},used:[]}:null;
NR.on("hi",m=>{const n=m.data&&String(m.data.n||"").slice(0,20);if(n&&O.host&&!O.st.pl.includes(n)&&O.st.pl.length<10){O.st.pl.push(n);O.st.tot[n]=0;bc();RO()}});
NR.on("state",m=>{if(O.host||!m.data)return;const j=JSON.stringify(m.data);if(j===O.last&&O.st)return;O.last=j;O.st=m.data;onSt()});
NR.on("ans",m=>{const d=m.data;if(!d||!Array.isArray(d.a))return;(O.ans[d.r]=O.ans[d.r]||{})[String(d.n).slice(0,20)]=d.a.map(x=>String(x).slice(0,40));if(S.scr=="o_score")RO()});
NR.on("stop",m=>{if(O.host&&O.st.ph=="play"&&m.data&&m.data.r==O.st.r)endR()});
const hi=()=>NR.emit("hi",{n:O.name});hi();O.t1=setInterval(()=>{hi();if(O.host)bc()},3000);
O.t2=setInterval(()=>{const t=$("tm");if(O.st&&O.st.ph=="play"){const l=Math.max(0,Math.ceil((O.st.end-Date.now())/1000));if(t)t.textContent=l;if(O.host&&l<=0)endR()}},500);
S.scr="o_lobby";onSt()}
function endR(){O.st.ph="score";bc();onSt()}
function onSt(){const st=O.st;if(!st)return RO();
if(st.ph=="play"&&O.mineR!=st.r){O.mineR=st.r;O.mine=st.cats.map(()=>"")}
if(st.ph=="score"&&O.sent!=st.r){O.sent=st.r;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}NR.emit("ans",{r:st.r,n:O.name,a:O.mine||[]})}
S.scr={lobby:"o_lobby",play:"o_play",score:"o_score",rank:"o_rank"}[st.ph];RO()}
function RO(){const ae=document.activeElement,fk=ae&&ae.classList&&ae.classList.contains("ai")?ae.dataset.k:null,pos=fk!==null?ae.selectionStart:0;RO0();if(fk!==null){const el=document.querySelector('.ai[data-k="'+fk+'"]');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
function RO0(){const a=$("app"),st=O.st,sc=S.scr;
if(sc=="o_menu"){a.innerHTML=`<h1>🌐 Jouer en ligne</h1><p style="color:var(--mut)">Chacun joue sur son téléphone. Scanne le QR code de l’hôte ou entre son code. ${window.claude?"Les participants doivent avoir accès à cette page.":"L’hôte doit garder son écran allumé pendant la partie."}</p><h2>1. Ton prénom</h2><div class="card"><input id="on" placeholder="Ton prénom" maxlength="20" value="${esc(O.name)}"></div><h2>2. Rejoindre avec un code</h2><div class="card"><input id="oc" placeholder="Code (4 caractères)" maxlength="4" style="text-transform:uppercase" value="${esc((O.pre||"").toUpperCase())}"><button class="p" data-o="join" style="margin-top:12px">Rejoindre</button></div><h2>Ou créer une partie</h2><div class="card"><button class="p" data-o="create" style="margin-top:0">Créer une partie</button></div>${O.busy?`<p>⏳ Connexion en cours…</p>`:""}${O.err?`<p style="color:var(--ac)">${O.err}</p>`:""}<button data-o="back" style="margin-top:14px">← Retour</button>`}
else if(!st){a.innerHTML=`<h1>Code ${O.code.toUpperCase()}</h1><p>En attente de l’hôte…</p><button data-o="back">Quitter</button>`}
else if(sc=="o_lobby"){a.innerHTML=`<h1>Code <span style="color:var(--ac);letter-spacing:.1em">${O.code.toUpperCase()}</span></h1><p style="color:var(--mut);margin-top:0">Les autres joueurs scannent ce QR code ou saisissent le code.</p><div style="text-align:center"><div id="qr" style="background:#fff;padding:10px;border-radius:12px;display:inline-block"></div></div><h2>Joueurs (${st.pl.length})</h2><div class="card">${st.pl.map(p=>`<div class="rk"><span>${esc(p)}</span></div>`).join("")}</div><h2>Catégories</h2><div class="chips">${st.cats.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>${O.host?`<button class="p" data-o="start">Lancer la manche</button>`:`<p>L’hôte lance la partie…</p>`}<button data-o="back" style="margin-top:12px">Quitter</button>`;if(window.QRCode&&$("qr"))new QRCode($("qr"),{text:QL+"#"+O.code,width:170,height:170})}
else if(sc=="o_play"){a.innerHTML=`<h1>Manche ${st.r}</h1><div class="big" style="font-size:90px">${st.letter}</div><div class="time" id="tm">${Math.max(0,Math.ceil((st.end-Date.now())/1000))}</div>${st.cats.map((c,i)=>`<div style="margin-top:8px"><label style="color:var(--mut);font-size:14px">${esc(c)}</label><input class="ai" data-k="${i}" maxlength="40" autocomplete="off" value="${esc(O.mine[i])}"></div>`).join("")}<button class="p" data-o="stop">STOP ! J’ai fini</button>`}
else if(sc=="o_score"){const r=SC(st.r);const tt=st.pl.map(p=>r[p].reduce((x,y)=>x+y,0));
a.innerHTML=`<h1>Manche ${st.r} · lettre ${st.letter}</h1><p style="color:var(--mut);margin:0 0 10px">10 = unique, 5 = doublon, 0 = vide ou mauvaise lettre.</p><div class="card sc"><table><tr><th></th>${st.pl.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>${st.cats.map((c,i)=>`<tr><td>${esc(c)}</td>${st.pl.map(p=>`<td>${esc((O.ans[st.r]&&O.ans[st.r][p]||[])[i]||"–")}<br><b>${r[p][i]}</b></td>`).join("")}</tr>`).join("")}<tr><td><b>Total</b></td>${tt.map(t=>`<td><b>${t}</b></td>`).join("")}</tr></table></div>${O.host?`<button class="p" data-o="val">Valider la manche</button>`:`<p>L’hôte valide les points…</p>`}`}
else{const rk=st.pl.map(p=>[p,st.tot[p]||0]).sort((x,y)=>y[1]-x[1]);a.innerHTML=`<h1>🏆 Classement</h1><div class="card">${rk.map((x,i)=>`<div class="rk"><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${esc(x[0])}</span><b>${x[1]} pts</b></div>`).join("")}</div>${O.host?`<button class="p" data-o="start">Manche suivante</button><button data-o="new" style="width:100%;margin-top:10px">Remettre les scores à zéro</button>`:`<p>L’hôte lance la suite…</p>`}<button data-o="back" style="margin-top:12px">Quitter</button>`}}
document.addEventListener("input",e=>{if(e.target.classList.contains("ai"))O.mine[+e.target.dataset.k]=e.target.value});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-o]");if(!b)return;const o=b.dataset.o,st=O.st;
const nm=()=>{const v=($("on")||{}).value;if(v&&v.trim())O.name=v.trim().slice(0,20);return O.name};
if(o=="menu"){O.err=RM?"":"Mode en ligne indisponible : le script de connexion ne s’est pas chargé. Vérifie ta connexion internet et recharge la page.";S.scr="o_menu";RO()}
else if(o=="create"){if(O.busy)return;if(!nm()){O.err="Entre ton prénom d’abord.";return RO()}O.err="";O.busy=true;RO();const al="abcdefghjkmnpqrstuvwxyz23456789";await conn([0,1,2,3].map(()=>al[Math.floor(Math.random()*al.length)]).join(""),true)}
else if(o=="join"){if(O.busy)return;const c=($("oc").value||"").trim().toLowerCase();O.pre=c;if(!nm()){O.err="Entre ton prénom d’abord.";return RO()}if(c.length<3){O.err="Entre le code de la partie.";return RO()}O.err="";O.busy=true;RO();await conn(c,false)}
else if(o=="back"){clearInterval(O.t1);clearInterval(O.t2);try{NR&&await NR.leave()}catch(x){}NR=null;O.st=null;S.scr="setup";R()}
else if(o=="start"){let p=[...L].filter(c=>!st.used.includes(c));if(!p.length){st.used=[];p=[...L]}const l=p[Math.floor(Math.random()*p.length)];st.used.push(l);Object.assign(st,{ph:"play",r:st.r+1,letter:l,end:Date.now()+st.dur*1000});bc();onSt()}
else if(o=="stop"){NR.emit("stop",{r:st.r})}
else if(o=="val"){const r=SC(st.r);st.pl.forEach(p=>st.tot[p]=(st.tot[p]||0)+r[p].reduce((x,y)=>x+y,0));st.ph="rank";bc();onSt()}
else if(o=="new"){st.pl.forEach(p=>st.tot[p]=0);st.used=[];st.r=0;bc();RO()}
});
</script></body></html>
